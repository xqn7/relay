[package]
name = "relay"
version = "0.1.0"
description = "Relay music player"
authors = ["xqn7"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros", "rt-multi-thread", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
tauri-plugin-single-instance = "2"
windows-core = "0.62"
windows = { version = "0.62", features = ["Media", "Foundation", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_Media_Audio", "Win32_UI_Shell_PropertiesSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
