<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay</title>
    <!-- The splash is plain HTML/CSS so it paints before any script loads. -->
    <style>
      html, body { margin: 0; background: #0a0a0b; }
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: #0a0a0b; transition: opacity 220ms cubic-bezier(.2,.8,.2,1);
      }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash svg { width: 88px; height: 88px; overflow: visible; }
      #splash .sun { transform: translateY(26px); animation: rise 760ms cubic-bezier(.2,.8,.2,1) forwards; }
      #splash .l1, #splash .l2 { transform-origin: 50px 0; transform: scaleX(.4); opacity: 0; animation: grow 520ms cubic-bezier(.2,.8,.2,1) forwards; }
      #splash .l2 { animation-delay: 90ms; }
      @keyframes rise { to { transform: translateY(0); } }
      @keyframes grow { to { transform: scaleX(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <clipPath id="above"><rect x="0" y="0" width="100" height="60" /></clipPath>
        <g clip-path="url(#above)"><path class="sun" d="M24 58a26 26 0 0 1 52 0z" fill="#fff" /></g>
        <rect class="l1" x="14" y="64" width="72" height="7" rx="3.5" fill="#fff" fill-opacity=".44" />
        <rect class="l2" x="31" y="77" width="38" height="7" rx="3.5" fill="#fff" fill-opacity=".22" />
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
